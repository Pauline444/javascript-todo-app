<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>TODO APP</title>
</head>

<body>
    <h1>Todo App</h1>
    <div class="wrapper">
        <form action="#">
            <input type="text" id="todo-input" placeholder="write your to-do here and hit enter..." autocomplete="off">
            <button id="add-button">Add</button>
        </form>
        <ul id="todo-list">
            <li class="todo">
                <input type="checkbox" id="todo-1">
                <label for="todo-1" class="custom-checkbox">
                    <img src="sources/check_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg">
                </label>
                <label for="todo-1" class="todo-text">
                    todo project with html, css & javascript
                </label>
                <button class="delete-btn">
                    <img src="sources/close_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.png">
                </button>
            </li>

            <li class="todo">
                <input type="checkbox" id="todo-2">
                <label for="todo-2" class="custom-checkbox">
                    <img src="sources/check_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg">
                </label>
                <label for="todo-2" class="todo-text">
                    todo project with html, css & javascript
                </label>
                <button class="delete-btn">
                    <img src="sources/close_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.png">
                </button>
            </li>

        </ul>
    </div>
</body>

</html>
